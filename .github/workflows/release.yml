# Release pipeline: push a v* tag and everything below happens automatically.
#   git tag v0.4.0 && git push origin v0.4.0
#
# scripts/dist.sh cross-compiles all three binaries for darwin/linux
# (amd64+arm64) plus a windows zip, writes checksums.txt and generates the
# Homebrew formula, and this workflow publishes the set as a GitHub release.
# After it goes green, copy the formula into the tap (see docs/DISTRIBUTION.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build release artifacts
        run: ./scripts/dist.sh
        env:
          CHIMERA_VERSION: ${{ github.ref_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/chimera_*.tar.gz \
            dist/chimera_*.zip \
            dist/checksums.txt \
            dist/chimera.rb \
            --title "chimera $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
