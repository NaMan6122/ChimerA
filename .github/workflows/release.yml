# Release pipeline: push a v* tag and everything below happens automatically.
#   git tag v0.4.1 && git push origin v0.4.1
#
# scripts/dist.sh cross-compiles all three binaries for darwin/linux
# (amd64+arm64) plus windows (amd64+arm64) zips, writes checksums.txt and
# generates the Homebrew formula, and this workflow verifies the test suite,
# publishes the set as a GitHub release, and (for stable tags) pushes the
# formula into the tap so `brew upgrade` sees the new version automatically.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test (race)
        run: go test -race ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build & smoke-test release artifacts
        env:
          CHIMERA_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/dist.sh
          ruby -c dist/chimera.rb
          CHIMERA_FROM_DIR=dist CHIMERA_PREFIX=/tmp/chimera-smoke ./install.sh --quiet
          /tmp/chimera-smoke/bin/chimera -version | grep -Fq "$CHIMERA_VERSION"
          /tmp/chimera-smoke/bin/chimera-kimi -version | grep -Fq "$CHIMERA_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            dist/chimera_*.tar.gz \
            dist/chimera_*.zip \
            dist/checksums.txt \
            dist/chimera.rb \
            --title "chimera $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE_FLAG

      # Homebrew updates alongside stable releases only so pre-release RC tags
      # never promote onto `brew upgrade`.
      - name: Update Homebrew tap
        if: "!contains(github.ref_name, '-')"
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_TOKEN is not set — skipping the tap update."
            echo "The formula is attached to the release; copy it into the tap by hand."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/NaMan6122/homebrew-chimera.git" tap
          cp dist/chimera.rb tap/Formula/chimera.rb
          cd tap
          if git diff --quiet; then
            echo "formula already current — nothing to push"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chimera ${VERSION#v}"
          git push
