; LOG_DIR comes from the environment (Dockerfile ENV, and the entrypoint
; exports it before exec) so every log lands on the mounted logs directory.
[supervisord]
nodaemon=true
logfile=%(ENV_LOG_DIR)s/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
autorestart=true
stdout_logfile=%(ENV_LOG_DIR)s/xvfb.log
stderr_logfile=%(ENV_LOG_DIR)s/xvfb.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -rfbauth /root/.vnc/passwd -forever -shared -rfbport 5900 -localhost
autorestart=true
stdout_logfile=%(ENV_LOG_DIR)s/x11vnc.log
stderr_logfile=%(ENV_LOG_DIR)s/x11vnc.err
depends_on=xvfb

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
stdout_logfile=%(ENV_LOG_DIR)s/novnc.log
stderr_logfile=%(ENV_LOG_DIR)s/novnc.err
depends_on=x11vnc

[program:chimera]
command=/usr/local/bin/chimera
environment=DISPLAY=":99"
autorestart=true
stdout_logfile=%(ENV_LOG_DIR)s/chimera.log
stderr_logfile=%(ENV_LOG_DIR)s/chimera.err
depends_on=xvfb
